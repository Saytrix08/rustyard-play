<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Rustyard Tycoon</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">
<script>
// Ton auf iPad und iPhone: Ohne das gilt Web-Audio als Klingelton (stumm im Lautlos-Modus) und startet
// nur, wenn es direkt bei einer Beruehrung fortgesetzt wird. Godot setzt es erst im naechsten Bild fort.
// Die Version (b1b9c59 13.10.2026_09:36) setzt tools/publish_web.sh ein. Fuer den Ton-Check im Dev-Menue zaehlt das
// Skript ausserdem, welche Ton-Bausteine Godot anlegt, und merkt sich die letzten Fehlermeldungen.
(function () {
	window.rustyardBuild = 'b1b9c59 13.10.2026_09:36';
	var stats = { sources: 0, worklets: 0, modules: 0, errors: [] };
	function note(kind, args) {
		var text = Array.prototype.slice.call(args).join(' ');
		if (/audio|worklet|sound|sample/i.test(text)) { stats.errors.push(kind + ': ' + text.slice(0, 90)); }
		if (stats.errors.length > 3) { stats.errors.shift(); }
	}
	var origError = console.error, origWarn = console.warn;
	console.error = function () { note('Fehler', arguments); return origError.apply(console, arguments); };
	console.warn = function () { note('Warnung', arguments); return origWarn.apply(console, arguments); };
	window.addEventListener('unhandledrejection', function (e) { note('Abgelehnt', [String(e.reason)]); });
	var session = navigator.audioSession;
	if (session) { try { session.type = 'playback'; } catch (e) {} }
	var Base = window.AudioContext || window.webkitAudioContext;
	if (!Base) { return; }
	var contexts = window.rustyardAudio = [];
	class Tracked extends Base { constructor(opts) { super(opts); contexts.push(this); } }
	window.AudioContext = Tracked;
	if (window.webkitAudioContext) { window.webkitAudioContext = Tracked; }
	var start = AudioBufferSourceNode.prototype.start;
	AudioBufferSourceNode.prototype.start = function () { stats.sources++; return start.apply(this, arguments); };
	if (window.AudioWorkletNode) {
		var Worklet = window.AudioWorkletNode;
		window.AudioWorkletNode = class extends Worklet { constructor(c, n, o) { super(c, n, o); stats.worklets++; } };
	}
	if (window.AudioWorklet) {
		var addModule = AudioWorklet.prototype.addModule;
		AudioWorklet.prototype.addModule = function () {
			return addModule.apply(this, arguments).then(function (r) { stats.modules++; return r; },
				function (e) { note('Modul', [String(e)]); throw e; });
		};
	}
	function unlock() {
		contexts.forEach(function (c) {
			if (c.state === 'running' && c.rustyardUnlocked) { return; }
			c.resume();
			// Ein leerer Puffer direkt in der Beruehrung gibt den Ton auf iOS sicher frei
			var src = c.createBufferSource();
			src.buffer = c.createBuffer(1, 1, c.sampleRate);
			src.connect(c.destination);
			src.start(0);
			c.rustyardUnlocked = true;
		});
	}
	['touchstart', 'touchend', 'pointerup', 'click', 'keydown'].forEach(function (name) {
		document.addEventListener(name, unlock, true);
	});
	// Piep direkt vom Browser, an Godot vorbei: hoert man den, ist der Weg zum Lautsprecher frei
	window.rustyardBeep = function () {
		var c = contexts[0];
		if (!c) { return false; }
		var osc = c.createOscillator(), gain = c.createGain();
		osc.frequency.value = 660;
		gain.gain.value = 0.25;
		osc.connect(gain);
		gain.connect(c.destination);
		osc.start();
		osc.stop(c.currentTime + 0.4);
		return true;
	};
	window.rustyardAudioInfo = function () {
		return ['Version ' + window.rustyardBuild,
			'Web-Audio: ' + contexts.map(function (c) { return c.state + ' ' + c.sampleRate + ' Hz'; }).join(', ')
				+ ', Sitzung ' + (session ? session.type : 'fehlt'),
			'Godot: ' + stats.sources + ' Sounds, ' + stats.worklets + ' Worklets, ' + stats.modules + ' Module']
			.concat(stats.errors.length ? stats.errors : ['keine Ton-Fehler']).join(' · ');
	};
})();
</script>
	</head>
	<body>
		<canvas id="canvas">

		</canvas>

		<noscript>

		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":27840040,"index.wasm":35740641},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
